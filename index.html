<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="3DN — AI·3D·4D 몰입형 기술 기업 홈페이지"
    />
    <meta http-equiv="refresh" content="0; url=https://a8efee20d62f5609-mbnpdv8mnf.skywork.website/" />
    <title>3DN | AI·3D·4D 몰입형 기술 기업</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080817;
        --surface: #0c0c20;
        --text: #f8fafc;
        --muted: #94a3b8;
        --blue: #60a5fa;
        --indigo: #4f46e5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 75% 25%, rgba(79, 70, 229, 0.22), transparent 28rem),
          linear-gradient(135deg, #080817 0%, #0a0a1a 52%, #141432 100%);
        color: var(--text);
        font-family: "DM Sans", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        opacity: 0.32;
        background-image:
          linear-gradient(rgba(96, 165, 250, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(96, 165, 250, 0.08) 1px, transparent 1px);
        background-size: 48px 48px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 92%);
        pointer-events: none;
      }

      .shell {
        width: min(100% - 40px, 720px);
        text-align: center;
      }

      .mark {
        display: inline-grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border: 1px solid rgba(96, 165, 250, 0.45);
        background: rgba(79, 70, 229, 0.18);
        color: var(--text);
        font: 700 1.1rem/1 "Space Grotesk", "Pretendard", sans-serif;
        letter-spacing: -0.08em;
        box-shadow: 0 0 42px rgba(37, 99, 235, 0.25);
      }

      .eyebrow {
        margin: 28px 0 0;
        color: var(--blue);
        font: 700 0.68rem/1.4 "Space Grotesk", "Pretendard", sans-serif;
        letter-spacing: 0.24em;
      }

      h1 {
        margin: 18px 0 0;
        font: 500 clamp(2.8rem, 8vw, 6rem)/0.95 "Space Grotesk", "Pretendard", sans-serif;
        letter-spacing: -0.06em;
      }

      p {
        max-width: 540px;
        margin: 24px auto 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.85;
      }

      .loader {
        width: min(100%, 280px);
        height: 2px;
        margin: 34px auto 0;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
      }

      .loader::after {
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(90deg, var(--indigo), var(--blue));
        content: "";
        animation: loading 1.25s ease-in-out infinite;
      }

      .fallback {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        padding: 13px 18px;
        border: 1px solid rgba(96, 165, 250, 0.35);
        background: rgba(12, 12, 32, 0.7);
        color: var(--text);
        font-size: 0.82rem;
        font-weight: 700;
        text-decoration: none;
        transition: 180ms ease;
      }

      .fallback:hover {
        border-color: var(--blue);
        background: rgba(37, 99, 235, 0.16);
        transform: translateY(-2px);
      }

      .note {
        margin-top: 26px;
        color: #64748b;
        font-size: 0.72rem;
      }

      @keyframes loading {
        0% {
          transform: translateX(-130%);
        }
        100% {
          transform: translateX(330%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="mark" aria-hidden="true">3D</div>
      <p class="eyebrow">AI × STEREOSCOPIC × ATTRACTION</p>
      <h1>BEYOND<br />REALITY.</h1>
      <p>
        3DN 리뉴얼 홈페이지로 이동하고 있습니다.<br />
        잠시 후 AI·3D·4D 몰입형 기술 사이트가 열립니다.
      </p>
      <div class="loader" aria-hidden="true"></div>
      <a
        class="fallback"
        href="https://a8efee20d62f5609-mbnpdv8mnf.skywork.website/"
      >
        홈페이지 바로 열기 <span aria-hidden="true">↗</span>
      </a>
      <p class="note">GitHub Pages에 이 파일을 업로드하면 자동으로 동작합니다.</p>
    </main>

    <script>
      window.location.replace("https://a8efee20d62f5609-mbnpdv8mnf.skywork.website/");
    </script>
  </body>
</html>
